syntax = "proto3";

package integration;

import "queue.proto";
import "tbmsg.proto";

option java_package = "org.thingsboard.server.gen.integration";
option java_outer_classname = "IntegrationProtos";
option java_multiple_files = true;

// Wire contract between the platform and a remote integration process.
// Recovered from the PE 4.3.1.1 generated classes; field numbers preserved verbatim so that
// the two sides stay compatible with the original PE remote integration executable.

service IntegrationTransport {
  rpc handleMsgs(stream RequestMsg) returns (stream ResponseMsg) {}
}

message AssetUplinkDataProto {
  string assetName = 1;
  string assetType = 2;
  string customerName = 3;
  string groupName = 4;
  transport.PostTelemetryMsg postTelemetryMsg = 5;
  transport.PostAttributeMsg postAttributesMsg = 6;
  string assetLabel = 7;
}

message IntegrationDownlinkMsgProto {
  int64 tenantIdMSB = 1;
  int64 tenantIdLSB = 2;
  int64 integrationIdMSB = 3;
  int64 integrationIdLSB = 4;
  bytes data = 5;
  msgqueue.TbMsgProto dataProto = 6;
}

message ConnectRequestMsg {
  string integrationRoutingKey = 1;
  string integrationSecret = 2;
  string serviceId = 3;
}

enum ConnectResponseCode {
  ACCEPTED = 0;
  BAD_CREDENTIALS = 1;
  SERVER_UNAVAILABLE = 2;
}

message ConnectResponseMsg {
  ConnectResponseCode responseCode = 1;
  string errorMsg = 2;
  IntegrationConfigurationProto configuration = 3;
}

message ConverterConfigurationProto {
  int64 tenantIdMSB = 1;
  int64 tenantIdLSB = 2;
  int64 converterIdMSB = 3;
  int64 converterIdLSB = 4;
  string name = 5;
  bool debugMode = 6;
  string configuration = 7;
  string additionalInfo = 8;
  string debugSettings = 9;
  string integrationType = 10;
  int32 converterVersion = 11;
}

message ConverterProto {
  int64 converterIdMSB = 1;
  int64 converterIdLSB = 2;
  int64 createdTime = 3;
  int64 tenantIdMSB = 4;
  int64 tenantIdLSB = 5;
  string type = 6;
  string name = 7;
  bool debugMode = 8;
  string configuration = 9;
  string additionalInfo = 10;
  bool isEdgeTemplate = 11;
  int64 externalIdMSB = 12;
  int64 externalIdLSB = 13;
  int64 version = 14;
  string debugSettings = 15;
  string integrationType = 16;
  int32 converterVersion = 17;
}

message ConverterRequestProto {
  int64 converterIdMSB = 1;
  int64 converterIdLSB = 2;
  int64 tenantIdMSB = 3;
  int64 tenantIdLSB = 4;
}

message ConverterUpdateMsg {
  ConverterConfigurationProto configuration = 1;
}

message DeviceDownlinkDataProto {
  string deviceName = 1;
  string deviceType = 2;
  bytes tbMsg = 3;
  msgqueue.TbMsgProto tbMsgProto = 4;
}

message DeviceUplinkDataProto {
  string deviceName = 1;
  string deviceType = 2;
  string customerName = 3;
  string groupName = 4;
  transport.PostTelemetryMsg postTelemetryMsg = 5;
  transport.PostAttributeMsg postAttributesMsg = 6;
  string deviceLabel = 7;
}

message DownlinkMsg {
  DeviceDownlinkDataProto deviceData = 1;
}

message EntityViewDataProto {
  string deviceName = 1;
  string deviceType = 2;
  string viewName = 3;
  string viewType = 4;
  repeated string telemetryKeys = 5;
}

message IntegrationApiRequestMsg {
  IntegrationInfoListRequestProto integrationListRequest = 1;
  IntegrationRequestProto integrationRequest = 2;
  ConverterRequestProto converterRequest = 3;
  TenantProfileRequestProto tenantProfileRequest = 4;
}

message IntegrationApiResponseMsg {
  IntegrationInfoListResponseProto integrationListResponse = 1;
  IntegrationProto integrationResponse = 2;
  ConverterProto converterResponse = 3;
  transport.TenantProfileProto tenantProfileResponse = 4;
}

message IntegrationConfigurationProto {
  int64 tenantIdMSB = 1;
  int64 tenantIdLSB = 2;
  ConverterConfigurationProto uplinkConverter = 3;
  ConverterConfigurationProto downlinkConverter = 4;
  string name = 5;
  string routingKey = 6;
  string type = 7;
  bool debugMode = 8;
  string configuration = 9;
  string additionalInfo = 10;
  bool enabled = 11;
  int64 integrationIdMSB = 12;
  int64 integrationIdLSB = 13;
  string debugSettings = 14;
}

message IntegrationInfoListRequestProto {
  string type = 1;
  bool enabled = 2;
  bool remote = 3;
}

message IntegrationInfoListResponseProto {
  repeated IntegrationInfoProto integrationInfoList = 1;
}

message IntegrationInfoProto {
  int64 integrationIdMSB = 1;
  int64 integrationIdLSB = 2;
  int64 tenantIdMSB = 3;
  int64 tenantIdLSB = 4;
  string type = 5;
  string name = 6;
  bool enabled = 7;
  bool remote = 8;
  bool allowCreateDevicesOrAssets = 9;
}

message IntegrationProto {
  int64 integrationIdMSB = 1;
  int64 integrationIdLSB = 2;
  int64 createdTime = 3;
  int64 tenantIdMSB = 4;
  int64 tenantIdLSB = 5;
  string type = 6;
  string name = 7;
  bool debugMode = 8;
  bool enabled = 9;
  bool remote = 10;
  bool allowCreateDevicesOrAssets = 11;
  bool isEdgeTemplate = 12;
  int64 defaultConverterIdMSB = 13;
  int64 defaultConverterIdLSB = 14;
  int64 downlinkConverterIdMSB = 15;
  int64 downlinkConverterIdLSB = 16;
  string routingKey = 17;
  string secret = 18;
  string configuration = 19;
  string additionalInfo = 20;
  int64 externalIdMSB = 21;
  int64 externalIdLSB = 22;
  int64 version = 23;
  string debugSettings = 24;
}

message IntegrationRequestProto {
  int64 tenantIdMSB = 1;
  int64 tenantIdLSB = 2;
  int64 integrationIdMSB = 3;
  int64 integrationIdLSB = 4;
  string routingKey = 5;
}

message IntegrationStatisticsProto {
  transport.PostTelemetryMsg postTelemetryMsg = 1;
}

message IntegrationUpdateMsg {
  IntegrationConfigurationProto configuration = 1;
}

message IntegrationValidationRequestProto {
  int64 idMSB = 1;
  int64 idLSB = 2;
  string serviceId = 3;
  IntegrationProto configuration = 4;
  string type = 5;
  int64 tenantIdMSB = 6;
  int64 tenantIdLSB = 7;
  int64 timestamp = 8;
  int64 deadline = 9;
}

enum MessageType {
  CONNECT_RPC_MESSAGE = 0;
  UPLINK_RPC_MESSAGE = 1;
}

message RequestMsg {
  MessageType messageType = 1;
  ConnectRequestMsg connectRequestMsg = 2;
  UplinkMsg uplinkMsg = 3;
}

message ResponseMsg {
  ConnectResponseMsg connectResponseMsg = 1;
  UplinkResponseMsg uplinkResponseMsg = 2;
  DownlinkMsg downlinkMsg = 3;
  IntegrationUpdateMsg integrationUpdateMsg = 4;
  ConverterUpdateMsg converterUpdateMsg = 5;
}

message TbEventProto {
  TbEventSource source = 1;
  string type = 2;
  string uid = 3;
  string data = 4;
  string deviceName = 5;
  bytes event = 6;
}

enum TbEventSource {
  INTEGRATION = 0;
  UPLINK_CONVERTER = 1;
  DOWNLINK_CONVERTER = 2;
  DEVICE = 3;
}

message TbIntegrationEventProto {
  TbEventSource source = 1;
  int64 tenantIdMSB = 2;
  int64 tenantIdLSB = 3;
  int64 eventSourceIdMSB = 4;
  int64 eventSourceIdLSB = 5;
  bytes event = 6;
  string deviceName = 7;
}

message TbIntegrationTsDataProto {
  TbEventSource source = 1;
  int64 tenantIdMSB = 2;
  int64 tenantIdLSB = 3;
  int64 entityIdMSB = 4;
  int64 entityIdLSB = 5;
  repeated transport.TsKvProto tsData = 6;
}

message TenantProfileRequestProto {
  int64 tenantIdMSB = 1;
  int64 tenantIdLSB = 2;
}

message ToCoreIntegrationMsg {
  IntegrationInfoProto integration = 1;
  DeviceUplinkDataProto deviceUplinkProto = 2;
  AssetUplinkDataProto assetUplinkProto = 3;
  EntityViewDataProto entityViewDataProto = 4;
  bytes customTbMsg = 5;
  TbIntegrationEventProto eventProto = 6;
  TbIntegrationTsDataProto tsDataProto = 7;
  msgqueue.TbMsgProto customTbMsgProto = 8;
}

message ToIntegrationExecutorDownlinkMsg {
  IntegrationDownlinkMsgProto downlinkMsg = 1;
  IntegrationValidationRequestProto validationRequestMsg = 2;
}

message ToIntegrationExecutorNotificationMsg {
  transport.ComponentLifecycleMsgProto componentLifecycle = 1;
}

message UplinkMsg {
  int32 uplinkMsgId = 1;
  repeated DeviceUplinkDataProto deviceData = 2;
  repeated EntityViewDataProto entityViewData = 3;
  repeated IntegrationStatisticsProto integrationStatistics = 4;
  repeated TbEventProto eventsData = 5;
  repeated bytes tbMsg = 6;
  repeated AssetUplinkDataProto assetData = 7;
  repeated msgqueue.TbMsgProto tbMsgProto = 8;

  // CE-only extension, deliberately given a field number far above PE's range so PE peers simply
  // ignore it as an unknown field and the rest of this contract stays wire-compatible.
  //
  // PE puts a fully-formed serialized TbMsg in `tbMsg` (the remote side runs the converter). This
  // port instead puts the *raw device payload* there and lets the platform run the converter, which
  // leaves nowhere to carry the protocol-level metadata a converter needs - the MQTT topic above
  // all. This map is that slot. It describes the payloads in this message, which is unambiguous
  // because a remote uplink carries exactly one payload.
  map<string, string> payloadMetadata = 100;
}

message UplinkProcessingResultProto {
  int32 uplinkMsgId = 1;
  bool success = 2;
  string errorMsg = 3;
}

message UplinkResponseMsg {
  bool success = 1;
  string errorMsg = 2;
}
