<div class="tb-password-content mat-app-background tb-dark flex flex-row items-center justify-center"
     style="width: 100%;">
  <mat-card appearance="raised" class="tb-password-card flex flex-initial">
    <mat-card-content class="!p-6">
      <div class="flex flex-col items-center justify-center gap-4">
        @if (activated) {
          <mat-icon color="primary" style="font-size: 48px; width: 48px; height: 48px;">check_circle</mat-icon>
          <span class="text-center" translate>signup.email-verification-sent</span>
        } @else if (failed) {
          <mat-icon color="warn" style="font-size: 48px; width: 48px; height: 48px;">error</mat-icon>
          <span class="text-center">{{ 'signup.sign-up' | translate }}</span>
        } @else {
          <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
        }
        <button mat-flat-button color="primary" type="button" (click)="gotoLogin()">
          {{ 'login.login' | translate }}
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
