<div class="tb-entity-view-owner-groups-dialog" style="min-width: 460px;">
  <mat-toolbar color="primary">
    <h2 translate>entity-view.owner-and-groups</h2>
    <span class="flex-1"></span>
    <button mat-icon-button (click)="cancel()" type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (form) {
    <div mat-dialog-content>
      <form [formGroup]="form" class="flex flex-col gap-2" style="padding-top: 8px;">
        <tb-entity-select
          class="mat-block"
          formControlName="owner"
          appearance="outline"
          [entityTypeLabel]="'entity-view.owner' | translate"
          [allowedEntityTypes]="[entityType.TENANT, entityType.CUSTOMER]">
        </tb-entity-select>
        <tb-entity-group-list
          formControlName="groupIds"
          excludeGroupAll
          [labelText]="'entity-view.groups' | translate"
          [groupType]="entityType.ENTITY_VIEW"
          [ownerId]="ownerId()"
          [createGroupFunction]="createGroupFunction"
          [appearance]="'outline'">
        </tb-entity-group-list>
      </form>
    </div>
    <div mat-dialog-actions class="flex items-center justify-end">
      <button mat-button type="button" (click)="cancel()">{{ 'action.cancel' | translate }}</button>
      <button mat-raised-button color="primary" type="button" (click)="save()">
        {{ 'action.save' | translate }}
      </button>
    </div>
  }
</div>
