<!-- 文件职责：设备日志列表模板；详情数据仅在打开右侧抽屉后加载。 -->
<main class="device-log-page">
  <section class="log-list-panel">
    <form class="log-toolbar" (ngSubmit)="submitSearch()">
      <!-- 设备总数与筛选控件放在同一行，避免统计信息单独占据整行。 -->
      <div class="device-count" aria-live="polite">
        <span class="meta-dot" aria-hidden="true"></span>
        <span>设备</span>
        <strong>{{totalElements}}</strong>
        <small>台</small>
      </div>
      <label class="search-field">
        <span>设备名称</span>
        <input name="search" [(ngModel)]="search" placeholder="输入设备名称搜索">
      </label>
      <button type="submit" class="primary-button">查询</button>
      <button type="button" class="secondary-button" (click)="resetSearch()">重置</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead><tr><th>设备名称</th><th>设备配置类型</th><th class="status-column">状态</th><th class="operation-column">操作</th></tr></thead>
        <tbody>
          <tr *ngIf="loading"><td colspan="4" class="table-state">正在读取设备列表…</td></tr>
          <tr *ngIf="!loading && loadError"><td colspan="4" class="table-state error">设备列表读取失败，请稍后重试</td></tr>
          <tr *ngIf="!loading && !loadError && !devices.length"><td colspan="4" class="table-state">当前用户暂无可见设备</td></tr>
          <!-- 整行都可切换当前设备；具体操作按钮阻止冒泡，避免复制等操作误触发详情切换。 -->
          <tr *ngFor="let device of devices; trackBy: trackByDeviceId"
              class="device-row"
              (click)="openDevice(device)"
              [class.selected-row]="selectedDevice?.deviceId === device.deviceId">
            <td class="device-name" [title]="device.deviceName">
              <!-- 设备名称直接作为选择入口，抽屉打开时也可切换当前详情设备。 -->
              <button type="button" class="device-select-button"
                      [class.selected]="selectedDevice?.deviceId === device.deviceId"
                        [attr.aria-pressed]="selectedDevice?.deviceId === device.deviceId">{{device.deviceName}}</button>
            </td>
            <td class="profile-name" [title]="device.deviceProfileName || '未配置'">{{device.deviceProfileName || '未配置'}}</td>
            <td class="status-column">
              <span class="device-status-badge"
                    [class.online]="device.active === true"
                    [class.offline]="device.active === false"
                    [class.pending]="device.active === null">
                <span class="status-dot" aria-hidden="true"></span>
                {{device.active === true ? '在线' : device.active === false ? '离线' : '读取中'}}
              </span>
            </td>
            <td class="operation-column">
              <div class="operation-actions">
                <button type="button" mat-icon-button class="icon-action" matTooltip="查看日志"
                         [attr.aria-label]="'查看日志：' + device.deviceName" (click)="$event.stopPropagation(); openDevice(device)">
                  <mat-icon>history</mat-icon>
                </button>
                <!-- 参考原生设备页的“复制 ID”操作，仅复制设备标识，不修改设备数据。 -->
                <button type="button" class="copy-device-button" matTooltip="复制设备ID"
                         [attr.aria-label]="'复制设备ID：' + device.deviceName" (click)="$event.stopPropagation(); copyDeviceId(device)">复制设备ID</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav class="pagination" aria-label="设备日志列表分页">
      <span>共 {{totalElements}} 台设备</span>
      <button type="button" (click)="changePage(page - 1)" [disabled]="page === 0">上一页</button>
      <strong>{{totalPages ? page + 1 : 0}} / {{totalPages}}</strong>
      <button type="button" (click)="changePage(page + 1)" [disabled]="!totalPages || page + 1 >= totalPages">下一页</button>
    </nav>
  </section>

  <tb-device-log-detail-drawer *ngIf="selectedDevice" [device]="selectedDevice" (close)="closeDrawer()"></tb-device-log-detail-drawer>
</main>
