<label class="root-asset-filter">
  <span>根资产</span>
  <select [value]="selectedRootAssetId" (change)="onSelectionChange($event)" aria-label="按根资产筛选">
    <option value="">全部根资产</option>
    @for (root of roots; track root.id) {
      <option [value]="root.id">{{root.name}}</option>
    }
  </select>
</label>
