<label class="asset-search">
  <tb-icon>search</tb-icon>
  <input [value]="search" (input)="onSearchInput($event)" [placeholder]="searchPlaceholder" [attr.aria-label]="searchPlaceholder">
</label>

@if (loading) {
  <div class="asset-state">正在读取资产…</div>
} @else if (loadError) {
  <div class="asset-state error">资产树读取失败</div>
} @else if (!tree.roots.length) {
  <div class="asset-state">当前没有可见资产</div>
} @else {
  <div class="asset-tree" role="tree" [attr.aria-label]="treeAriaLabel">
    @for (item of visibleAssetNodes; track item.node.id) {
      <button type="button" class="asset-node"
              [class.selected]="selectedIds.has(item.node.id)"
              [class.locked]="!isSelectable(item.node)"
              [class.device-node]="item.node.entityType === 'DEVICE'"
              [class.device-alarm]="item.node.entityType === 'DEVICE' && alarmDeviceIds.has(item.node.id)"
              [style.--depth]="item.depth"
              (click)="onSelectNode(item.node)"
              role="treeitem"
              [attr.aria-selected]="selectedIds.has(item.node.id)"
              [attr.aria-disabled]="!isSelectable(item.node)"
              [attr.aria-expanded]="item.node.childIds.length ? expandedIds.has(item.node.id) : null"
              [attr.title]="item.node.entityType === 'DEVICE' ? (alarmDeviceIds.has(item.node.id) ? '存在未清除告警' : item.node.name) : item.node.name">
        @if (item.node.childIds.length) {
          <span class="tree-toggle" tabindex="0"
                (click)="onToggleNode($event, item.node)"
                (keydown.enter)="onToggleNode($event, item.node)"
                (keydown.space)="onToggleNode($event, item.node)">
            <tb-icon>{{expandedIds.has(item.node.id) ? 'expand_more' : 'chevron_right'}}</tb-icon>
          </span>
        } @else {
          <span class="tree-toggle spacer"></span>
        }
        <tb-icon class="asset-icon">{{item.node.entityType === 'DEVICE' ? 'devices' : 'domain'}}</tb-icon>
        <span class="asset-name">{{item.node.name}}</span>
      </button>
    }
  </div>
}
