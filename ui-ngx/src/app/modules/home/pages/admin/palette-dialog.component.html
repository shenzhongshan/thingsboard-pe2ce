<div class="tb-palette-dialog">
  <mat-toolbar color="primary">
    <h2 translate>white-labeling.edit-palette</h2>
    <span class="flex-1"></span>
    <button mat-icon-button (click)="cancel()" type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <div mat-dialog-content>
    <div class="tb-palette-hues">
      @for (hue of hues; track hue) {
        <div class="tb-palette-hue-row" [style.background-color]="colors[hue]"
             [class.tb-dark]="isDark(hue)">
          <span class="tb-hue-label">{{ hue }}</span>
          <span class="tb-hue-name">
            @if (hueLabels[hue]) {
              {{ hueLabels[hue] | translate }}
            }
          </span>
          <tb-color-input asBoxInput noBorder
                          [ngModel]="colors[hue]"
                          (ngModelChange)="colorChanged(hue, $event)">
          </tb-color-input>
          <span class="tb-hue-hex">{{ colors[hue] }}</span>
        </div>
      }
    </div>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end gap-2">
    <button mat-button type="button" (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary" type="button" (click)="save()">
      {{ 'white-labeling.save-palette' | translate }}
    </button>
  </div>
</div>
