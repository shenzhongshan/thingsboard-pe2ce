<div>
  <mat-card appearance="outlined">
    <mat-card-header class="tb-secret-header">
      <mat-card-title>
        <span class="mat-headline-5" translate>secret.secrets</span>
      </mat-card-title>
      <span class="flex-1"></span>
      @if (searchMode) {
        <mat-form-field class="tb-secret-search" subscriptSizing="dynamic">
          <input matInput [(ngModel)]="textSearch" (ngModelChange)="searchChanged()"
                 placeholder="{{ 'common.enter-search' | translate }}">
        </mat-form-field>
        <button mat-icon-button type="button" (click)="exitSearchMode()"><mat-icon>close</mat-icon></button>
      } @else {
        <button mat-icon-button type="button" (click)="addSecret()"
                matTooltip="{{ 'secret.add' | translate }}" matTooltipPosition="above">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-icon-button type="button" (click)="reload()"
                matTooltip="{{ 'action.refresh' | translate }}" matTooltipPosition="above">
          <mat-icon>refresh</mat-icon>
        </button>
        <button mat-icon-button type="button" (click)="enterSearchMode()"
                matTooltip="{{ 'action.search' | translate }}" matTooltipPosition="above">
          <mat-icon>search</mat-icon>
        </button>
      }
    </mat-card-header>
    <mat-card-content>
      <table class="tb-secret-table" mat-table [dataSource]="secrets">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>{{ 'secret.name' | translate }}</th>
          <td mat-cell *matCellDef="let s">{{ s.name }}</td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef style="width: 130px;">{{ 'secret.type' | translate }}</th>
          <td mat-cell *matCellDef="let s">{{ secretTypeTranslations.get(s.type) | translate }}</td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>{{ 'secret.description' | translate }}</th>
          <td mat-cell *matCellDef="let s">
            <div class="flex flex-row items-center">
              <span class="flex-1">{{ s.description || '' }}</span>
              <button mat-icon-button type="button" (click)="editDescription($event, s)"
                      matTooltip="{{ 'secret.edit-description' | translate }}" matTooltipPosition="above">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef style="width: 100px;"></th>
          <td mat-cell *matCellDef="let s">
            <div class="flex flex-row items-center justify-end">
              <button mat-icon-button type="button" (click)="changeValue($event, s)"
                      matTooltip="{{ 'secret.change-value' | translate }}" matTooltipPosition="above">
                <mat-icon>lock_reset</mat-icon>
              </button>
              <button mat-icon-button type="button" (click)="deleteSecret($event, s)"
                      matTooltip="{{ 'action.delete' | translate }}" matTooltipPosition="above">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="['name', 'type', 'description', 'actions']"></tr>
        <tr mat-row *matRowDef="let s; columns: ['name', 'type', 'description', 'actions'];"></tr>
      </table>
      @if (!secrets.length) {
        <div class="tb-secret-empty" translate>secret.no-secrets-text</div>
      }
      <mat-paginator [length]="totalElements" [pageIndex]="page" [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 20, 30]" (page)="pageChanged($event)"
                     showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
