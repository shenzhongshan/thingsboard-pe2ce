<mat-card appearance="outlined" class="flex flex-col">
  <mat-card-header>
    <mat-card-title class="flex items-center justify-between gap-2">
      <span>{{solutionTemplate.title}}</span>
      @if (solutionTemplate.level !== SolutionTemplateLevel.MAKER) {
        <span class="level">{{solutionTemplate.level}}</span>
      }
    </mat-card-title>
  </mat-card-header>
  <div mat-card-image>
    <img [src]="solutionTemplate.previewImageUrl" (click)="openSolutionTemplateDetails()" alt="{{solutionTemplate.title}}">
  </div>
  <mat-card-actions class="grid items-end gap-4 p-4">
    @if (solutionTemplate.installed) {
      <button mat-button mat-stroked-button color="primary" class="xs:self-start"
              [disabled]="isLoading$ | async" (click)="openInstructions()">
        {{ 'solution-template.instructions' | translate }}
      </button>
    }
    <div class="col-start-2 flex flex-wrap justify-end gap-4">
      <button mat-button mat-stroked-button color="primary"
              [disabled]="isLoading$ | async" (click)="openSolutionTemplateDetails()">
        {{ 'solution-template.details' | translate }}
      </button>
      @if (!solutionTemplate.installed) {
        <button mat-button mat-raised-button color="primary"
                [disabled]="isLoading$ | async" (click)="installSolutionTemplate()">
          {{ 'solution-template.install' | translate }}
        </button>
      }
      @if (solutionTemplate.installed) {
        <button mat-button mat-raised-button color="warn"
                [disabled]="isLoading$ | async" (click)="deleteSolutionTemplate()">
          {{ 'solution-template.delete' | translate }}
        </button>
      }
    </div>
  </mat-card-actions>
</mat-card>
