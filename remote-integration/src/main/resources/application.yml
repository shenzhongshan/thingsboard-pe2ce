server:
  # local ingress the devices on this network POST their payloads to
  port: "${HTTP_BIND_PORT:8081}"
  address: "${HTTP_BIND_ADDRESS:0.0.0.0}"

integration:
  # copy these two from the integration you created in ThingsBoard (must be marked "remote")
  routingKey: "${INTEGRATION_ROUTING_KEY:}"
  secret: "${INTEGRATION_SECRET:}"
  # identifies this process in the platform logs
  serviceId: "${INTEGRATION_SERVICE_ID:remote-integration}"
  rpc:
    host: "${RPC_HOST:localhost}"
    port: "${RPC_PORT:9090}"
    reconnect_delay_sec: "${RPC_RECONNECT_DELAY_SEC:10}"

logging:
  level:
    org.thingsboard.integration.remote: INFO
